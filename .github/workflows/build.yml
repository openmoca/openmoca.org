name: Build

# The site is built from the other OpenMOCA repositories, each checked out at its pin below.
# scripts/sync-docs.mjs reads the same pins to point links at the right commit on GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The other MOCA repositories, at fixed refs: release tags, or commits; never a branch
# (moca-spec CONTRIBUTING.md).
env:
  MOCA_SPEC_REF: v0.6.0
  MOCA_READER_TYPESCRIPT_REF: v0.6.0
  MOCA_READER_PYTHON_REF: v0.6.0
  MOCA_READER_DOTNET_REF: v0.6.0
  MOCA_TOOLS_REF: v0.6.0
  MOCA_MCP_DOTNET_REF: v0.6.0
  MOCA_CONVERT_REF: v0.6.0
  MOCA_EXAMPLES_REF: v0.6.0

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openmoca.org
      # The check lives in moca-spec, the one copy every open repository runs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node moca-spec/scripts/check-deps.mjs openmoca.org

  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openmoca.org
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-python
          ref: ${{ env.MOCA_READER_PYTHON_REF }}
          path: moca-reader-python
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-reader-dotnet
          ref: ${{ env.MOCA_READER_DOTNET_REF }}
          path: moca-reader-dotnet
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-tools
          ref: ${{ env.MOCA_TOOLS_REF }}
          path: moca-tools
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-mcp-dotnet
          ref: ${{ env.MOCA_MCP_DOTNET_REF }}
          path: moca-mcp-dotnet
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-convert
          ref: ${{ env.MOCA_CONVERT_REF }}
          path: moca-convert
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/moca-examples
          ref: ${{ env.MOCA_EXAMPLES_REF }}
          path: moca-examples
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openmoca.org/package-lock.json
      - run: npm ci
        working-directory: openmoca.org
      # The siblings are checked out at their pins, so the working trees are the pinned content.
      - run: npm run build
        env:
          # The private names the site must never show, kept out of this public repository.
          MOCA_PRIVATE_NAMES: ${{ secrets.MOCA_PRIVATE_NAMES }}
        working-directory: openmoca.org
