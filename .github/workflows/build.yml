name: Build

# The site is built from the other OpenMOCA repositories, each checked out at its pin below.
# scripts/sync-docs.mjs reads the same pins to point links at the right commit on GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The deploy job (deploy.yml) builds with this workflow, and deploys what it uploads.
  workflow_call:
    inputs:
      upload:
        description: Upload the built site for the deploy job
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The other MOCA repositories, at fixed refs: full commit SHAs, with the tag in a comment; never a tag or a branch
# (moca-spec CONTRIBUTING.md). scripts/sync-docs.mjs refuses anything else.
env:
  MOCA_SPEC_REF: 9adec0e95c978fda6a16bfda01970ede5f78754b  # v0.7.0
  MOCA_READER_TYPESCRIPT_REF: 26c617b8a3789d30d89ce1af6a2e11c983e475f8  # v0.7.0
  MOCA_READER_PYTHON_REF: 67ae930c5dd6fe6275cf7f840dfc3848448180b2  # v0.7.0
  MOCA_READER_DOTNET_REF: 8bc0e0ebe4bbc7667dc014eb2fb9ca8ddef91549  # v0.7.0
  MOCA_TOOLS_REF: 010e4049142c218de2062919b0fe45e595dde4ad  # v0.7.0
  MOCA_MCP_DOTNET_REF: 327b60007a36439252ee52076145550cba34ac62  # v0.7.0
  MOCA_CONVERT_REF: ee238df02fe616dedf220da80bea1e25dedb79be  # v0.7.0
  MOCA_EXAMPLES_REF: 832a1786cbcff4fae748a7cebe23b62ef99bd89c  # v0.6.0

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openmoca.org
      # The check lives in moca-spec, the one copy every open repository runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node moca-spec/scripts/check-deps.mjs openmoca.org

  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openmoca.org
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-reader-python
          ref: ${{ env.MOCA_READER_PYTHON_REF }}
          path: moca-reader-python
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-reader-dotnet
          ref: ${{ env.MOCA_READER_DOTNET_REF }}
          path: moca-reader-dotnet
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-tools
          ref: ${{ env.MOCA_TOOLS_REF }}
          path: moca-tools
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-mcp-dotnet
          ref: ${{ env.MOCA_MCP_DOTNET_REF }}
          path: moca-mcp-dotnet
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-convert
          ref: ${{ env.MOCA_CONVERT_REF }}
          path: moca-convert
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/moca-examples
          ref: ${{ env.MOCA_EXAMPLES_REF }}
          path: moca-examples
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openmoca.org/package-lock.json
      - run: npm ci
        working-directory: openmoca.org
      # The siblings are checked out at their pins, so the working trees are the pinned content.
      - run: npm run build
        env:
          # The private names the site must never show, kept out of this public repository.
          MOCA_PRIVATE_NAMES: ${{ secrets.MOCA_PRIVATE_NAMES }}
        working-directory: openmoca.org
      - run: npm test
        working-directory: openmoca.org
      # The built site, served through the Worker as Cloudflare serves it: every kind of page has the security headers,
      # and its policy allows each of its inline scripts by hash.
      - name: Check the headers on every kind of page
        working-directory: openmoca.org
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 1; done
          npm run check:site || { tail -20 wrangler.log; exit 1; }
      - if: ${{ inputs.upload }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: |
            openmoca.org/dist/
            openmoca.org/worker/generated/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
